name: Build

# Compiles the app without signing it and publishes it for sideloading.
# This repository is public, so the workflow uses no secrets and the resulting
# .ipa must never contain private values.
#
# Channels:
#   latest  pushes to main          -> release tag "latest-build"
#   test    pushes to any other branch, or a manual run from one -> release tag "test-build"
# Each release holds Shortlist.ipa and source.json, at fixed URLs:
#   https://github.com/<owner>/<repo>/releases/download/<channel>-build/Shortlist.ipa
#   https://github.com/<owner>/<repo>/releases/download/<channel>-build/source.json

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "reports/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test core package
        run: swift test --package-path ShortlistCore

      - name: Test build scripts
        run: python3 -m unittest discover -s scripts -v

  ipa:
    name: Unsigned ipa
    needs: test
    runs-on: macos-26
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose channel
        id: channel
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then channel=latest; else channel=test; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Channel: $channel"

      - name: Record build info
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os
          info = {"channel": os.environ["CHANNEL"], "commit": os.environ["GITHUB_SHA"], "branch": os.environ["BRANCH"]}
          with open("app/Resources/BuildInfo.json", "w", encoding="utf-8") as handle:
              json.dump(info, handle, indent=2)
          print(info)
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec app/project.yml

      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project app/Shortlist.xcodeproj \
            -scheme Shortlist \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | xcbeautify

      - name: Package ipa
        run: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Release-iphoneos/Shortlist.app"
          test -f "$app/Shortlist"
          mkdir -p build/Payload
          cp -R "$app" build/Payload/
          # Ad-hoc signature so the binary carries its entitlements. The sideloading
          # tool replaces this signature with a real one on the phone.
          codesign --force --sign - --entitlements app/Shortlist.entitlements build/Payload/Shortlist.app
          (cd build && zip -qry Shortlist.ipa Payload)

      - name: Check ipa contents
        run: |
          set -euo pipefail
          plutil -p build/Payload/Shortlist.app/Info.plist | grep -E 'CFBundle(Identifier|ShortVersionString|Version)|MinimumOSVersion'
          codesign -dv build/Payload/Shortlist.app 2>&1 | grep -E 'Identifier|Signature'
          cat build/Payload/Shortlist.app/BuildInfo.json
          if [ -e build/Payload/Shortlist.app/embedded.mobileprovision ]; then
            echo "A provisioning profile must not be shipped in the public build" >&2
            exit 1
          fi
          ls -lh build/Shortlist.ipa

      - name: Write SideStore source
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          python3 scripts/make_source.py \
            --app build/Payload/Shortlist.app \
            --ipa build/Shortlist.ipa \
            --entitlements app/Shortlist.entitlements \
            --channel "$CHANNEL" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$CHANNEL-build/Shortlist.ipa" \
            --icon-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/assets/icon.png" \
            --out build/source.json

      - uses: actions/upload-artifact@v7
        with:
          name: Shortlist-${{ steps.channel.outputs.channel }}
          path: |
            build/Shortlist.ipa
            build/source.json
          if-no-files-found: error

  release:
    name: Publish ${{ needs.ipa.outputs.channel }} build
    needs: ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish per channel at a time, so two branches cannot interleave.
    concurrency:
      group: release-${{ needs.ipa.outputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Shortlist-${{ needs.ipa.outputs.channel }}
          path: dist

      - name: Replace rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.ipa.outputs.channel }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$CHANNEL-build"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          cat > notes.md <<EOF
          Unsigned **$CHANNEL** build #$GITHUB_RUN_NUMBER from branch \`$BRANCH\`, commit $GITHUB_SHA.
          SideStore signs it on the phone.

          Add this channel to SideStore once (paste into Safari on the iPhone):

              sidestore://source?url=$base/source.json

          Or install this build directly:

              sidestore://install?url=$base/Shortlist.ipa
          EOF
          sed -i 's/^          //' notes.md
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$tag" dist/Shortlist.ipa dist/source.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$CHANNEL build #$GITHUB_RUN_NUMBER ($BRANCH)" \
            --notes-file notes.md \
            --prerelease
